<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roadmap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--teal:#0E6E55;--teal-dark:#0A5544;--teal-pale:#E1F1EC;--violet:#6C4BC8;--violet-pale:#EDE7FA;
--amber:#E8A33D;--bg:#F5FAF8;--surface:#FFFFFF;--ink:#14231F;--ink-soft:#5B6E68;--border:#DCEAE4;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1815;--surface:#182420;--ink:#EAF3EF;--ink-soft:#93A6A0;--border:#25332E;--teal-pale:#123A2E;--violet-pale:#241B42;}}
:root[data-theme="dark"]{--bg:#0F1815;--surface:#182420;--ink:#EAF3EF;--ink-soft:#93A6A0;--border:#25332E;--teal-pale:#123A2E;--violet-pale:#241B42;}
*{box-sizing:border-box;}html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;}
.shell{display:flex;min-height:100vh;}
.rail{width:76px;background:var(--teal-dark);display:flex;flex-direction:column;align-items:center;padding:20px 0;gap:26px;flex-shrink:0;}
.rail .logo{width:34px;height:34px;border-radius:9px;background:var(--amber);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:700;color:#3A2A0F;font-size:16px;}
.rail nav a{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#BFE3D6;margin-top:22px;}
.rail nav a.active{background:rgba(255,255,255,.12);color:#fff;}
.rail nav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;}
.main{flex:1;padding:34px 40px 60px;max-width:760px;}
h1{font-family:'Fraunces',serif;font-weight:600;font-size:26px;margin:0 0 4px;}
.sub{color:var(--ink-soft);font-size:14px;margin:0 0 26px;}
.hero{display:flex;gap:26px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px;margin-bottom:26px;}
.ring{width:110px;height:110px;border-radius:50%;flex-shrink:0;background:conic-gradient(var(--teal) 62%, var(--teal-pale) 0);display:flex;align-items:center;justify-content:center;}
.hole{width:84px;height:84px;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;}
.hole b{font-size:19px;font-family:'Fraunces',serif;}
.hole span{font-size:10.5px;color:var(--ink-soft);}
.hero .eyebrow{font-size:12.5px;color:var(--ink-soft);margin-bottom:4px;}
.hero h2{font-family:'Fraunces',serif;font-size:21px;margin:0 0 10px;}
.topics{display:flex;gap:8px;flex-wrap:wrap;}
.topic{font-size:12px;padding:5px 11px;border-radius:999px;background:var(--violet-pale);color:var(--violet);font-weight:600;}
.mod{display:flex;align-items:center;gap:14px;padding:15px 4px;border-bottom:1px solid var(--border);}
.mod:last-child{border:none;}
.mbadge{width:36px;height:36px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:15px;}
.mbadge.done{background:var(--teal-pale);color:var(--teal-dark);}
.mbadge.now{background:var(--violet-pale);color:var(--violet);}
.mbadge.locked{background:var(--border);color:var(--ink-soft);}
.mod b{font-size:14.5px;display:block;}
.mod span{font-size:12px;color:var(--ink-soft);}
.mod .pct{margin-left:auto;font-size:13px;font-weight:600;color:var(--ink-soft);}
</style></head>
<body>
<div class="shell">
  <aside class="rail"><div class="logo">S</div>
    <nav>
      <a href="#"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></a>
      <a class="active" href="#"><svg viewBox="0 0 24 24"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/></svg></a>
      <a href="#"><svg viewBox="0 0 24 24"><path d="M4 4h16v12H7l-3 3z"/></svg></a>
      <a href="#"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 2.5-5 6-5s6 2 6 5"/></svg></a>
      <a href="#"><svg viewBox="0 0 24 24"><path d="M3 20V10M9 20V4M15 20v-7M21 20V13"/></svg></a>
    </nav>
  </aside>
  <main class="main">
    <h1>Your roadmap</h1>
    <p class="sub">Biology 101</p>
    <div class="hero">
      <div class="ring"><div class="hole"><b>62%</b><span>Module 2</span></div></div>
      <div>
        <div class="eyebrow">In progress</div>
        <h2>Cell Structure</h2>
        <div class="topics"><span class="topic">Organelles</span><span class="topic">Membrane transport</span><span class="topic">Cell wall</span></div>
      </div>
    </div>
    <div class="mod"><div class="mbadge done">✓</div><div><b>Intro to Cells</b><span>Module 1 · complete</span></div><div class="pct">100%</div></div>
    <div class="mod"><div class="mbadge now">●</div><div><b>Cell Structure</b><span>Module 2 · in progress</span></div><div class="pct">62%</div></div>
    <div class="mod"><div class="mbadge locked">🔒</div><div><b>Membrane Transport</b><span>Module 3 · locked</span></div><div class="pct">—</div></div>
    <div class="mod"><div class="mbadge locked">🔒</div><div><b>Cell Division</b><span>Module 4 · locked</span></div><div class="pct">—</div></div>
  </main>
</div>
</body></html>
