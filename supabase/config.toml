# Supabase project configuration.
#
# Edge functions: JWT verification is pinned explicitly (per-function entries
# override [functions.global]) so a future `supabase config push`/deploy
# change can never silently disable auth checks at the gateway.
#
# speech-transcribe also validates the caller in-function before processing
# audio; its provider remains configured by the function implementation.
project_id = "edviraa"

[functions.process-document]
verify_jwt = true

[functions.tutor-chat]
verify_jwt = true

[functions.rag-search]
verify_jwt = true

[functions.generate-roadmap]
verify_jwt = true

[functions.generate-study-materials]
verify_jwt = true

[functions.suggest-exam-feedback]
verify_jwt = true

[functions.speech-transcribe]
verify_jwt = true
